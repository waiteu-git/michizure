name = "michizure"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 🔴 Preview URL の名前空間は無効化する。「Durable Object を持つ Worker には
# Preview URL が生えない」という Cloudflare の既定は、初回本番デプロイ（2026-09-18）の
# 実測で【完全には効いていない】と判明した（版 43193a3c が Worker として実行され
# 500/Error 1101 を返した＝ルーティングは生きていた）。撮り直しのたびに何度もデプロイする
# 予定なので、これが無いと「直す前の版」が旧 preview URL で恒久的に読める状態になる。
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "TripRoom"

# 部屋の作成の速度制限（全体で1つ）のカウンタ。仕組みと根拠は src/create-limiter.ts。
# 前身の Workers Rate Limiting binding（ROOM_CREATE_LIMITER）は、公式が「permissive・eventually consistent・
# 正確な計数には使わない」と明記する道具で、本番では約195回連続でも429が一度も返らなかった（2026-09-18）ため撤去した。
[[durable_objects.bindings]]
name = "CREATE_LIMITER"
class_name = "CreateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 新しいクラスを作る（v2）。取り消しのきく追加だけ。
[[migrations]]
tag = "v2"
new_sqlite_classes = ["TripRoom", "CreateLimiter"]

# 🔴🔴 v3 は【取り消せない】。`Room` クラスを削除する＝**本番の全部屋（動画に映る「沖縄旅行」を含む）が消える**。
# 本人裁定（2026-10-01）: 本番で溜まった約195個のダミー部屋を、速度制限の置き換えと同じデプロイで片づける。
# - Cloudflare は deleted_classes の適用時に「Worker のコードがそのクラスを参照していないこと」を要求する
#   （公式 durable-object-class-migrations-legacy）。⇒ 同名で作り直せないので、クラスを `TripRoom` へ
#   名前を変えた（`renamed_classes` ではない＝それはデータを引き継ぐ。ここは引き継がない）。
# - v2（作成）→ v3（削除）は未適用のタグとして1回のアップロードで順に適用される（原子的）。
# ⚠ 実際の利用者が現れた後は選べない手順。適用済みのタグは書き換えない・消さない。
[[migrations]]
tag = "v3"
deleted_classes = ["Room"]

# ⚠ `[limits] cpu_ms` は【有料プラン専用】。無料プランでは deploy が
# `CPU limits are not supported for the Free plan [code: 100328]` で失敗する
# （2026-09-18 の初回本番デプロイで実測）。元の値 50 は計画書
# docs/superpowers/plans/2026-08-09-michizure-phase1a-backend.md:121 から
# 写したもので、実測に基づいていなかった。設計書
# docs/superpowers/specs/2026-08-09-michizure-phase1-design.md:118 は
# そもそも無料枠を前提にしている＝この3行の方が設計と食い違っていた。
# ⇒ 有料プランへ移るまで書かない。書くなら実測してから。

# 🔴 消してはいけない。新規 Worker では observability は【既定で有効】であり、
# 書かないと Cloudflare 側にログが保存される（無料プランで3日保持）。
# invocation log に何が含まれるかの公式なフィールド一覧は公開されておらず、
# 同じトレース基盤の tail handler ではリクエストヘッダが載る。その redaction 対象は
# cookie / auth / key / secret / token / jwt のみで cf-connecting-ip は【対象外】。
# ⇒「IPが載らない」ことを確認する手段が無いので、ログ自体を取らない側に倒す。
# 設計 §7.5・§11（保存する内容を正確に書く）に対応する。
# この行が消えたら `npm test` の pretest（scripts/check-privacy-config.mjs）が落ちる。
[observability]
enabled = false

# 🔴 TOKEN_SECRET を [vars] に書いてはいけない（2026-09-05 の監査で判明）。
# [vars] の値は deploy 時に【同名のリモートシークレットを置き換える】ため、
# `wrangler secret put TOKEN_SECRET` で本番鍵を入れた後に deploy すると
# 本番が開発用の値で上書きされる（wrangler 4.120.0 の
# checkRemoteSecretsOverride で確認。警告は出るが既定で続行しうる）。
# ⇒ 開発・テスト用の値は .dev.vars に置く（deploy に含まれない）。
# 本番は `wrangler secret put TOKEN_SECRET` のみ。
# scripts/check-privacy-config.mjs が両方を検査する。

# 静的配信。パスに一致するファイルがあればそれを返し、無ければ Worker が処理する
# ＝ /api/* は Worker、それ以外は public/ の中身
[assets]
directory = "./public"
# ⚠ Worker がある場合、パスに一致するアセットが無ければ【Worker が呼ばれる】。
# not_found_handling は Worker 側へ来る前には効かないので、
# /r/<部屋ID> は Worker が明示的に index.html を返す必要がある（binding を使う）
binding = "ASSETS"
